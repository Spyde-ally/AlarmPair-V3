name: Repair Server and Build AlarmPair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair server/package.json
        run: |
          mkdir -p server

          cat > server/package.json <<'EOF'
          {
            "name": "alarmpair-server",
            "version": "3.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js",
              "test": "node --test"
            },
            "dependencies": {
              "ws": "^8.18.0"
            },
            "engines": {
              "node": ">=18"
            }
          }
          EOF

      - name: Add real WebSocket integration tests
        run: |
          mkdir -p server/test

          cat > server/test/server.test.js <<'EOF'
          const test = require("node:test");
          const assert = require("node:assert/strict");
          const { spawn } = require("node:child_process");
          const http = require("node:http");
          const WebSocket = require("ws");

          let processHandle;
          let port;

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function httpGet(path) {
            return new Promise((resolve, reject) => {
              const request = http.get(
                `http://127.0.0.1:${port}${path}`,
                response => {
                  let body = "";

                  response.on("data", chunk => {
                    body += chunk;
                  });

                  response.on("end", () => {
                    try {
                      resolve({
                        statusCode: response.statusCode,
                        body: JSON.parse(body)
                      });
                    } catch (error) {
                      reject(error);
                    }
                  });
                }
              );

              request.on("error", reject);
            });
          }

          function openSocket() {
            return new Promise((resolve, reject) => {
              const socket = new WebSocket(
                `ws://127.0.0.1:${port}`
              );

              socket.once("open", () => resolve(socket));
              socket.once("error", reject);
            });
          }

          function nextMessage(socket, timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                cleanup();
                reject(new Error("Timed out waiting for WebSocket message"));
              }, timeoutMs);

              const onMessage = data => {
                cleanup();

                try {
                  resolve(JSON.parse(data.toString()));
                } catch (error) {
                  reject(error);
                }
              };

              const onError = error => {
                cleanup();
                reject(error);
              };

              function cleanup() {
                clearTimeout(timer);
                socket.off("message", onMessage);
                socket.off("error", onError);
              }

              socket.once("message", onMessage);
              socket.once("error", onError);
            });
          }

          async function sendAndReceive(socket, message) {
            socket.send(JSON.stringify(message));
            return nextMessage(socket);
          }

          test.before(async () => {
            port = 18080 + Math.floor(Math.random() * 1000);

            processHandle = spawn(
              process.execPath,
              ["server.js"],
              {
                cwd: process.cwd(),
                env: {
                  ...process.env,
                  PORT: String(port)
                },
                stdio: "ignore"
              }
            );

            for (let attempt = 0; attempt < 50; attempt++) {
              try {
                const result = await httpGet("/");

                if (
                  result.statusCode === 200 &&
                  result.body.ok === true
                ) {
                  return;
                }
              } catch (_) {
                await sleep(100);
              }
            }

            throw new Error("Server did not start");
          });

          test.after(() => {
            if (processHandle) {
              processHandle.kill("SIGTERM");
            }
          });

          test("health endpoint responds", async () => {
            const result = await httpGet("/");

            assert.equal(result.statusCode, 200);
            assert.equal(result.body.ok, true);
            assert.equal(result.body.service, "AlarmPair v3");
          });

          test("two devices can create and join a private pair", async () => {
            const deviceA = await openSocket();
            const deviceB = await openSocket();

            const pairedA = await sendAndReceive(
              deviceA,
              { type: "createPair" }
            );

            assert.equal(pairedA.type, "paired");
            assert.equal(pairedA.role, "A");
            assert.ok(pairedA.invite);
            assert.ok(pairedA.deviceToken);
            assert.ok(pairedA.pairId);

            const pairedBPromise = nextMessage(deviceB);

            deviceB.send(
              JSON.stringify({
                type: "joinPair",
                invite: pairedA.invite
              })
            );

            const pairedB = await pairedBPromise;

            assert.equal(pairedB.type, "paired");
            assert.equal(pairedB.role, "B");
            assert.ok(pairedB.deviceToken);
            assert.equal(pairedB.pairId, pairedA.pairId);

            deviceA.close();
            deviceB.close();
          });

          test("invalid alarm time is rejected", async () => {
            const device = await openSocket();

            const paired = await sendAndReceive(
              device,
              { type: "createPair" }
            );

            assert.equal(paired.type, "paired");

            const response = await sendAndReceive(
              device,
              {
                type: "setAlarm",
                targetAt: Date.now() - 1000
              }
            );

            assert.equal(response.type, "error");
            assert.match(
              response.message,
              /Invalid alarm time/
            );

            device.close();
          });

          test("invalid saved device token is rejected", async () => {
            const device = await openSocket();

            const response = await sendAndReceive(
              device,
              {
                type: "resume",
                deviceToken: "invalid-token"
              }
            );

            assert.equal(response.type, "error");
            assert.match(
              response.message,
              /Saved pairing|not recognized|Authenticate/i
            );

            device.close();
          });
          EOF

      - name: Install dependencies and generate package-lock.json
        run: |
          cd server
          npm install --no-audit --no-fund

      - name: Validate server syntax
        run: |
          node --check server/server.js

      - name: Run real server integration tests
        run: |
          cd server
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlarmPair-debug-repaired
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit repaired server files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/package.json
          git add server/package-lock.json
          git add server/test/server.test.js

          git commit -m "Repair server package and add integration tests" || echo "No changes to commit"

          git push origin HEAD:${{ github.ref_name }}
