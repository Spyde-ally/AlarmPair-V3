name: Apply AlarmPair Server Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Check branch
        run: |
          echo "Branch: $GITHUB_REF_NAME"

          if [ "$GITHUB_REF_NAME" != "fix/authoritative-pairing-startup" ]; then
            echo "This workflow must be run on fix/authoritative-pairing-startup"
            exit 1
          fi

      - name: Create server package.json
        run: |
          mkdir -p server

          cat > server/package.json <<'EOF'
          {
            "name": "alarmpair-server",
            "version": "3.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js",
              "test": "node --test"
            },
            "dependencies": {
              "ws": "^8.18.0"
            },
            "engines": {
              "node": ">=18"
            }
          }
          EOF

      - name: Create server tests
        run: |
          cat > server/server.test.js <<'EOF'
          const test = require("node:test");
          const assert = require("node:assert/strict");
          const WebSocket = require("ws");

          const { server, startServer } = require("./server.js");

          async function connect(port) {
            const socket = new WebSocket(`ws://127.0.0.1:${port}`);

            await new Promise((resolve, reject) => {
              const timeout = setTimeout(
                () => reject(new Error("connect timeout")),
                5000
              );

              socket.once("open", () => {
                clearTimeout(timeout);
                resolve();
              });

              socket.once("error", (err) => {
                clearTimeout(timeout);
                reject(err);
              });
            });

            return socket;
          }

          async function waitForMessage(
            socket,
            condition,
            timeoutMs = 5000
          ) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(
                () => reject(new Error("message timeout")),
                timeoutMs
              );

              const onMessage = (raw) => {
                try {
                  const msg = JSON.parse(raw.toString());

                  if (condition(msg)) {
                    clearTimeout(timer);
                    socket.off("message", onMessage);
                    resolve(msg);
                  }
                } catch (_) {}
              };

              socket.on("message", onMessage);
            });
          }

          async function closeSocket(socket) {
            if (
              socket.readyState === WebSocket.OPEN ||
              socket.readyState === WebSocket.CONNECTING
            ) {
              await new Promise((resolve) => {
                socket.once("close", resolve);
                socket.close();
              });
            }
          }

          test.before(async () => {
            await startServer(0);
          });

          test.after(async () => {
            await new Promise((resolve, reject) => {
              server.close((err) =>
                err ? reject(err) : resolve()
              );
            });
          });

          test("createPair creates a valid event and returns an invite", async () => {
            const port = server.address().port;
            const socket = await connect(port);

            socket.send(
              JSON.stringify({
                type: "createPair"
              })
            );

            const message = await waitForMessage(
              socket,
              (msg) => msg.type === "paired"
            );

            assert.equal(message.role, "A");
            assert.ok(message.pairId);
            assert.ok(message.deviceToken);
            assert.ok(message.invite || message.inviteCode);

            await closeSocket(socket);
          });

          test("joinPair can join a valid invite", async () => {
            const port = server.address().port;

            const creator = await connect(port);

            creator.send(
              JSON.stringify({
                type: "createPair"
              })
            );

            const created = await waitForMessage(
              creator,
              (msg) => msg.type === "paired"
            );

            const invite =
              created.invite || created.inviteCode;

            assert.ok(invite);

            const joiner = await connect(port);

            joiner.send(
              JSON.stringify({
                type: "joinPair",
                invite
              })
            );

            const joined = await waitForMessage(
              joiner,
              (msg) => msg.type === "paired"
            );

            assert.equal(joined.role, "B");

            const creatorStatus = await waitForMessage(
              creator,
              (msg) => msg.type === "pairStatus"
            );

            assert.equal(
              creatorStatus.connected,
              true
            );

            await closeSocket(creator);
            await closeSocket(joiner);
          });

          test("resume rejects stale device tokens", async () => {
            const port = server.address().port;

            const socket = await connect(port);

            socket.send(
              JSON.stringify({
                type: "resume",
                deviceToken: "invalid-token"
              })
            );

            const rejected = await waitForMessage(
              socket,
              (msg) => msg.type === "error"
            );

            assert.match(
              rejected.message,
              /Saved pairing|Authenticate|recogniz/i
            );

            await closeSocket(socket);
          });

          test("unauthenticated commands are rejected", async () => {
            const port = server.address().port;

            const socket = await connect(port);

            socket.send(
              JSON.stringify({
                type: "sync"
              })
            );

            const error = await waitForMessage(
              socket,
              (msg) => msg.type === "error"
            );

            assert.match(
              error.message,
              /Authenticate/i
            );

            await closeSocket(socket);
          });
          EOF

      - name: Verify server.js exists
        run: |
          test -f server/server.js || {
            echo "server/server.js is missing"
            exit 1
          }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Validate server syntax
        run: node --check server/server.js

      - name: Run server tests
        run: npm test --prefix server

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/package.json server/server.test.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add AlarmPair server protocol tests"
            git push origin "$GITHUB_REF_NAME"
          fi
