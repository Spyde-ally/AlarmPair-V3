name: AlarmPair CI and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'Spyde-ally-patch-1'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  server-preflight:
    name: Server preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check server files
        run: |
          set -e
          test -f server/server.js
          test -f server/package.json
          test -f server/server.test.js

      - name: Install server dependencies
        run: |
          npm install \
            --prefix server \
            --no-audit \
            --no-fund

      - name: Validate server syntax
        run: |
          node --check server/server.js

      - name: Run server tests
        run: |
          npm test --prefix server


  android-preflight:
    name: Android preflight
    runs-on: ubuntu-latest
    needs: server-preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Compile Kotlin
        run: |
          gradle compileDebugKotlin --stacktrace

      - name: Run Android lint
        run: |
          gradle lintDebug --stacktrace

      - name: Run Android unit tests
        run: |
          gradle testDebugUnitTest --stacktrace


  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: android-preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlarmPair-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
